<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; border-radius: 16px; background: linear-gradient(145deg, #edf5ff, #f9fffd); font-family: Arial, sans-serif; }
    .hint { margin: 0 0 10px; text-align: center; color: #2455a4; font-size: 14px; font-weight: 700; }
    .body-map { position: relative; width: min(100%, 720px); margin: auto; line-height: 0; }
    .body-map img { display: block; width: 100%; border: 1px solid #dbe7f8; border-radius: 14px; box-shadow: 0 10px 24px rgba(36, 85, 164, .12); }
    .hotspot { position: absolute; display: block; padding: 0; background: transparent; border: 2px solid transparent; border-radius: 50%; cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
    .hotspot:hover, .hotspot:focus { background: rgba(37, 99, 235, .38); border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .22); outline: none; }
    .tooltip { position: absolute; z-index: 2; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: 220px; padding: 8px 10px; border-radius: 8px; background: #101828; color: white; font-size: 12px; line-height: 1.3; text-align: center; opacity: 0; pointer-events: none; transition: opacity .15s; }
    .hotspot:hover .tooltip, .hotspot:focus .tooltip { opacity: 1; }
  </style>
</head>
<body>
  <p class="hint">신체 부위에 마우스를 올려 추천 운동을 보고, 클릭해 전체 운동을 확인하세요.</p>
  <div id="map" class="body-map"></div>
  <script>
    const send = (type, data = {}) => window.parent.postMessage(
      { isStreamlitMessage: true, type, ...data }, "*"
    );

    function setHeight() {
      send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
    }

    function render(args) {
      const map = document.getElementById("map");
      map.replaceChildren();
      const image = document.createElement("img");
      image.src = args.image_url;
      image.alt = "전신 근육 지도";
      image.onload = setHeight;
      map.append(image);

      (args.hotspots || []).forEach((spot) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hotspot";
        button.setAttribute("aria-label", `${spot.part} 운동 보기`);
        button.style.left = `${spot.left}%`;
        button.style.top = `${spot.top}%`;
        button.style.width = `${spot.width}%`;
        button.style.height = `${spot.height}%`;
        const tooltip = document.createElement("span");
        tooltip.className = "tooltip";
        const title = document.createElement("strong");
        title.textContent = spot.part;
        tooltip.append(title, document.createElement("br"));
        tooltip.append(document.createTextNode((spot.suggestions || []).join(" · ")));
        button.append(tooltip);
        button.addEventListener("click", () => {
          send("streamlit:setComponentValue", { value: spot.part });
        });
        map.append(button);
      });
      setHeight();
    }

    window.addEventListener("message", (event) => {
      if (event.data.type === "streamlit:render") render(event.data.args);
    });
    send("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
